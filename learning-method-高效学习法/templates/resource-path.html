<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>学习路径与资源卡片 — {{skill_name}}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f7fa; padding: 24px; }
  .container { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 20px; }
  .resource-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .resource-card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border-left: 4px solid #667eea; }
  .resource-card .role { font-size: 12px; color: #667eea; font-weight: 600; margin-bottom: 6px; }
  .resource-card h3 { font-size: 15px; margin-bottom: 8px; }
  .resource-card .meta-row { font-size: 12px; color: #666; margin-bottom: 4px; }
  .resource-card .dont { font-size: 12px; color: #e53935; margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee; }
  .timeline { position: relative; padding-left: 32px; }
  .timeline::before { content: ''; position: absolute; left: 12px; top: 0; bottom: 0; width: 2px; background: #e0e0e0; }
  .day-item { position: relative; margin-bottom: 20px; background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .day-item::before { content: attr(data-day); position: absolute; left: -32px; top: 16px; width: 24px; height: 24px; background: #667eea; color: #fff; border-radius: 50%; font-size: 11px; display: flex; align-items: center; justify-content: center; font-weight: 600; }
  .day-item h3 { font-size: 15px; margin-bottom: 8px; }
  .day-item .section { font-size: 13px; margin-bottom: 4px; }
  .day-item .section strong { color: #555; }
  .checklist { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .checklist h3 { font-size: 15px; margin-bottom: 12px; }
  .checklist label { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 8px; cursor: pointer; }
  .checklist input { accent-color: #667eea; width: 16px; height: 16px; }
</style>
</head>
<body>
<div class="container">
  <h1>📖 资源与学习路径</h1>

  <div class="resource-grid">
    {{resource_cards}}
  </div>

  <h2 style="margin-bottom:16px;">📅 天级学习路径</h2>
  <div class="timeline">
    {{days_rows}}
  </div>

  <div class="checklist" style="margin-top:24px;">
    <h3>✅ 每日检查清单</h3>
    <label><input type="checkbox"> 今天学习了 {{day_topic}}</label>
    <label><input type="checkbox"> 完成了 {{practice_count}} 道练习题</label>
    <label><input type="checkbox"> 用费曼法向自己讲解了一个核心概念</label>
    <label><input type="checkbox"> 写下来了今天的复盘笔记</label>
  </div>
</div>
</body>
</html>
