<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>速查表 — {{skill_name}}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #fff; padding: 24px; color: #333; }
  @media print { body { padding: 12px; } .answer { display: block !important; } }
  .header { text-align: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 2px solid #667eea; }
  .header h1 { font-size: 22px; color: #333; }
  .header p { font-size: 13px; color: #666; margin-top: 4px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .card { border-radius: 8px; padding: 14px; font-size: 13px; }
  .card h3 { font-size: 14px; margin-bottom: 8px; }
  .card ul { padding-left: 16px; line-height: 1.7; }
  .card li { margin-bottom: 4px; }
  .blue { background: #e8f0fe; border: 1px solid #c5d8f8; }
  .red { background: #fce8e6; border: 1px solid #f5c6c3; }
  .green { background: #e6f4ea; border: 1px solid #c8e6c9; }
  .orange { background: #fef3e0; border: 1px solid #fce0b8; }
  .purple { background: #f3e5f5; border: 1px solid #e1bee7; }
  .white { background: #fafafa; border: 1px solid #eee; }
  .answer { display: none; color: #388e3c; font-weight: 600; margin-top: 4px; }
  .toggle-btn { font-size: 11px; color: #667eea; cursor: pointer; text-decoration: underline; margin-top: 6px; display: inline-block; }
  .footer { margin-top: 16px; text-align: center; font-size: 11px; color: #aaa; }
</style>
</head>
<body>
<div class="header">
  <h1>⚡ 速查表：{{skill_name}}</h1>
  <p>一句话定义：{{one_sentence_definition}}</p>
</div>

<div class="grid">
  <div class="card blue">
    <h3>📌 核心概念</h3>
    <ul>{{concepts}}</ul>
  </div>
  <div class="card orange">
    <h3>💻 真实例子</h3>
    <ul>{{examples}}</ul>
  </div>
  <div class="card red">
    <h3>⚠️ 常见错误</h3>
    <ul>{{mistakes}}</ul>
  </div>
  <div class="card green">
    <h3>✅ 使用前检查清单</h3>
    <ul>{{checklist}}</ul>
  </div>
  <div class="card purple">
    <h3>🧠 自测题（点击揭晓答案）</h3>
    <ol>{{quiz_questions}}</ol>
    <button class="toggle-btn" onclick="document.querySelectorAll('.answer').forEach(el=>el.style.display='block')">全部显示答案</button>
  </div>
  <div class="card white">
    <h3>🔗 相关资源</h3>
    <ul>{{resources}}</ul>
  </div>
</div>

<div class="footer">Generated by Learning Method Skill</div>

<script>
  document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const answers = document.querySelectorAll('.answer');
      const showing = answers[0]?.style.display === 'block';
      answers.forEach(a => a.style.display = showing ? 'none' : 'block');
    });
  });
</script>
</body>
</html>
